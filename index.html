              <input type="checkbox"
                checked={selectedInvoices.size===invoices.length && invoices.length>0}
                onChange={e=>setSelectedInvoices(e.target.checked ? new Set(invoices.map(i=>i.id)) : new Set())}
                style={{width:18,height:18,cursor:"pointer"}}
              />
              {selectedInvoices.size===0 ? "Seleccionar todo" : `${selectedInvoices.size} seleccionada${selectedInvoices.size!==1?"s":""}`}
            </label>
            {selectedInvoices.size>0 && (
              <button onClick={()=>{
                const sel=[...invoices].sort((a,b)=>a.num>b.num?1:-1).filter(inv=>selectedInvoices.has(inv.id));
                if(sel.length) downloadInvoicesHTML(sel);
              }} style={{padding:"6px 16px",fontSize:16,border:"none",borderRadius:6,background:"#111",color:"#fff",cursor:"pointer",fontWeight:500}}>
                ⬇️ Descargar {selectedInvoices.size} factura{selectedInvoices.size!==1?"s":""} en 1 archivo
              </button>
            )}
            <span style={{fontSize:15,color:"#666"}}>{invoices.length} factura{invoices.length!==1?"s":""} · €{fmtCur(invoices.reduce((a,f)=>a+Number(f.total||0),0))}</span>
          </div>
          <div style={{display:"flex",gap:8}}>
            {invoices.length>0 && (
              <button onClick={()=>{
                const year=new Date().getFullYear();
                const sorted=[...invoices].sort((a,b)=>(a.date||"9999")>(b.date||"9999")?1:-1);
                const renumbered=sorted.map((inv,i)=>({...inv,num:`${inv.date?new Date(inv.date+"T00:00:00").getFullYear():year}/${pad3(i+1)}`}));
                setInvoices(renumbered);alert(`✓ ${renumbered.length} facturas renumeradas por fecha.`);
              }} style={{padding:"7px 14px",fontSize:15,border:"0.5px solid #3C3489",borderRadius:6,background:"none",cursor:"pointer",color:"#3C3489",fontWeight:500}}>
                🔢 Renumerar por fecha
              </button>
            )}
            <button onClick={()=>setInvoiceModal({id:Date.now(),num:"",date:todayStr,client:"CLIENTES VARIOS",concept:"",total:"",notes:""})}
              style={{padding:"7px 16px",fontSize:15,border:"0.5px solid #222",borderRadius:6,background:"#111",color:"#fff",cursor:"pointer",fontWeight:500}}>
              + Nueva factura
            </button>
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {[...invoices].sort((a,b)=>a.num>b.num?1:-1).map(inv=>{
            const base=Number(inv.total||0)/1.21, iva=Number(inv.total||0)-base;
            const d=inv.date?new Date(inv.date+"T00:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"}):"—";
            const isSel=selectedInvoices.has(inv.id);
            return (
              <div key={inv.id} style={{background:isSel?"#EEF6FF":"#ffffff",border:`0.5px solid ${isSel?"#7BBFEA":"#e5e5e5"}`,borderRadius:10,padding:"10px 16px",display:"flex",gap:12,alignItems:"center"}}>
                <input type="checkbox" checked={isSel}
                  onChange={e=>{const s=new Set(selectedInvoices);e.target.checked?s.add(inv.id):s.delete(inv.id);setSelectedInvoices(s);}}
                  style={{width:18,height:18,cursor:"pointer",flexShrink:0}}
                />
                <div style={{minWidth:56,textAlign:"center",background:"#f5f5f5",borderRadius:6,padding:"6px 4px",flexShrink:0}}>
                  <div style={{fontSize:12,color:"#666",fontWeight:500}}>Nº</div>
                  <div style={{fontSize:15,fontWeight:600}}>{inv.num||"—"}</div>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:500,fontSize:16}}>{inv.concept||"Sin concepto"}</div>
                  <div style={{fontSize:14,color:"#666"}}>{inv.client} · {d}</div>
                  <div style={{fontSize:13,color:"#888",marginTop:1}}>Base: €{fmtCur(base)} + IVA: €{fmtCur(iva)}</div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:18,fontWeight:600}}>€{fmtCur(inv.total)}</div>
                  <div style={{fontSize:13,color:"#666"}}>total c/IVA</div>
                </div>
                <div style={{display:"flex",gap:5,flexShrink:0}}>
                  <button onClick={()=>setInvoiceModal({...inv})} style={{fontSize:14,padding:"5px 10px",border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666"}}>Ver</button>
                  <button onClick={()=>setInvoices(is=>is.filter(i=>i.id!==inv.id))} style={{fontSize:14,padding:"5px 10px",border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#c00"}}>×</button>
                </div>
              </div>
            );
          })}
          {invoices.length===0 && <p style={{textAlign:"center",color:"#666",fontSize:16,padding:"2rem 0"}}>Sin facturas emitidas. Pulsa "+ Nueva factura" para crear la primera.</p>}
        </div>
      </>}

      {/* INVOICE MODAL */}
      {invoiceModal && (
        <InvoiceModal
          inv={invoiceModal}
          invoices={invoices}
          onSave={inv=>{setInvoices(is=>is.find(i=>i.id===inv.id)?is.map(i=>i.id===inv.id?inv:i):[...is,inv]); setInvoiceModal(null);}}
          onClose={()=>setInvoiceModal(null)}
          fmtCur={fmtCur}
          inp={inp}
          field={field}
        />
      )}

      {/* BULK INVOICE MODAL */}
      {bulkModal && (
        <BulkInvoiceModal
          onClose={()=>setBulkModal(false)}
          onSaveAll={newExpenses=>{
            setExpenses(ex=>[...ex,...newExpenses]);
            setBulkModal(false);
          }}
          EXPENSE_CATS={EXPENSE_CATS}
        />
      )}

      {/* EXPENSE FORM MODAL */}
      {expenseForm && (
        <ExpenseModal
          expenseForm={expenseForm}
          setExpenseForm={setExpenseForm}
          expenses={expenses}
          setExpenses={setExpenses}
          inp={inp}
          field={field}
          EXPENSE_CATS={EXPENSE_CATS}
        />
      )}

      {/* FORM MODAL */}
      {modal==="form" && form && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}>
          <div style={{background:"#ffffff",color:"#111",borderRadius:10,padding:"1.5rem",width:"100%",maxWidth:440,maxHeight:"90vh",overflowY:"auto",border:"0.5px solid #ddd"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}>
              <div style={{display:"flex",gap:6}}>
                {[["session","Sesión"],["block","Bloque"]].map(([k,lbl])=>(
                  <button key={k} onClick={()=>{setFormType(k);setForm(k==="session"?emptySession(form.date,form.time):emptyBlock(form.date,form.time));}}
                    style={{padding:"5px 12px",fontSize:15,border:"0.5px solid #222",borderRadius:6,background:formType===k?"#111":"#f5f5f5",color:formType===k?"#fff":"#111",cursor:"pointer",fontWeight:formType===k?500:400}}>
                    {lbl}
                  </button>
                ))}
              </div>
              <button onClick={()=>{setModal(null);setForm(null);}} style={{fontSize:20,border:"none",background:"none",cursor:"pointer",color:"#666"}}>×</button>
            </div>

            {formType==="session" ? <>
              {field("Cliente *", <input style={inp} value={form.client||""} onChange={e=>setForm(f=>({...f,client:e.target.value}))} placeholder="Nombre del cliente" />)}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                {field("Teléfono", <input style={inp} value={form.phone||""} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} placeholder="+34 600 000 000" />)}
                {field("Email", <input type="email" style={inp} value={form.email||""} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="correo@ejemplo.com" />)}
              </div>
              {field("Tipo de sesión", <select style={inp} value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>{SESSION_TYPES.map(t=><option key={t}>{t}</option>)}</select>)}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                {field("Fecha", <input type="date" style={inp} value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))} />)}
                {field("Hora", <select style={inp} value={form.time||""} onChange={e=>setForm(f=>({...f,time:e.target.value}))}><option value="">-- Hora --</option>{ALL_SLOTS.map(s=><option key={s}>{s}</option>)}</select>)}
              </div>
              {field("Total (€)", <input type="number" min="0" style={inp} value={form.total||""} onChange={e=>setForm(f=>({...f,total:e.target.value}))} placeholder="0" />)}

              {/* Reserva */}
              <div style={{border:"0.5px solid #ddd",borderRadius:6,padding:"10px 12px",marginBottom:12,background:"#fafafa"}}>
                <p style={{margin:"0 0 8px",fontSize:14,fontWeight:500,color:"#111"}}>Reserva / Señal</p>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  {field("Efectivo (€)", <input type="number" min="0" style={inp} value={form.depositEfectivo||""} onChange={e=>setForm(f=>({...f,depositEfectivo:e.target.value,depositAmt:String(Number(e.target.value||0)+Number(f.depositBizum||0)),depositMethod:""}))} placeholder="0" />)}
                  {field("Bizum / Transf. (€)", <input type="number" min="0" style={inp} value={form.depositBizum||""} onChange={e=>setForm(f=>({...f,depositBizum:e.target.value,depositAmt:String(Number(f.depositEfectivo||0)+Number(e.target.value||0)),depositMethod:""}))} placeholder="0" />)}
                </div>
                {(Number(form.depositEfectivo||0)+Number(form.depositBizum||0))>0 && (
                  <div style={{marginTop:6,fontSize:13,color:"#666"}}>
                    Total señal: <strong>€{fmtCur(Number(form.depositEfectivo||0)+Number(form.depositBizum||0))}</strong>
                    {Number(form.depositEfectivo||0)>0 && <span> · 💵 €{fmtCur(form.depositEfectivo)}</span>}
                    {Number(form.depositBizum||0)>0 && <span> · 📱 €{fmtCur(form.depositBizum)}</span>}
                  </div>
                )}
              </div>

              {/* Pago sesión */}
              <div style={{border:"0.5px solid #ddd",borderRadius:6,padding:"10px 12px",marginBottom:12,background:"#fafafa"}}>
                <p style={{margin:"0 0 8px",fontSize:14,fontWeight:500,color:"#111"}}>Pago en sesión</p>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  {field("Efectivo (€)", <input type="number" min="0" style={inp} value={form.sessionEfectivo||""} onChange={e=>setForm(f=>({...f,sessionEfectivo:e.target.value,sessionAmt:String(Number(e.target.value||0)+Number(f.sessionBizum||0)),sessionMethod:""}))} placeholder="0" />)}
                  {field("Bizum / Transf. (€)", <input type="number" min="0" style={inp} value={form.sessionBizum||""} onChange={e=>setForm(f=>({...f,sessionBizum:e.target.value,sessionAmt:String(Number(f.sessionEfectivo||0)+Number(e.target.value||0)),sessionMethod:""}))} placeholder="0" />)}
                </div>
                {(Number(form.sessionEfectivo||0)+Number(form.sessionBizum||0))>0 && (
                  <div style={{marginTop:6,fontSize:13,color:"#666"}}>
                    Total sesión: <strong>€{fmtCur(Number(form.sessionEfectivo||0)+Number(form.sessionBizum||0))}</strong>
                    {Number(form.sessionEfectivo||0)>0 && <span> · 💵 €{fmtCur(form.sessionEfectivo)}</span>}
                    {Number(form.sessionBizum||0)>0 && <span> · 📱 €{fmtCur(form.sessionBizum)}</span>}
                  </div>
                )}
              </div>

              {/* Resumen pagos */}
              {(() => {
                const total    = Number(form.total||0);
                const depEf    = Number(form.depositEfectivo||0);
                const depBiz   = Number(form.depositBizum||0);
                const sesEf    = Number(form.sessionEfectivo||0);
                const sesBiz   = Number(form.sessionBizum||0);
                const totalEf  = depEf + sesEf;
                const totalBiz = depBiz + sesBiz;
                const paid     = totalEf + totalBiz;
                const pending  = total - paid;
                const full     = total > 0 && paid >= total;
                return (
                  <div style={{marginBottom:12}}>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:8,marginBottom:8}}>
                      <div style={{background:"#f5f5f5",border:"0.5px solid #ddd",borderRadius:6,padding:"8px 10px"}}>
                        <span style={{fontSize:13,color:"#666",display:"block",marginBottom:2}}>Total cobrado</span>
                        <span style={{fontSize:17,fontWeight:500,color:"#111"}}>€{fmtCur(paid)}</span>
                      </div>
                      <div style={{background:full?"#EAF3DE":"#fff",border:`0.5px solid ${full?"#97C459":"#ddd"}`,borderRadius:6,padding:"8px 10px"}}>
                        <span style={{fontSize:13,color:full?"#3B6D11":"#666",display:"block",marginBottom:2}}>Total sesión</span>
                        <span style={{fontSize:17,fontWeight:500,color:full?"#3B6D11":"#111"}}>€{fmtCur(total)}</span>
                        {full && <span style={{fontSize:12,color:"#3B6D11",display:"block"}}>✓ Pagado completo</span>}
                      </div>
                      <div style={{background:pending>0?"#FCEBEB":"#f5f5f5",border:`0.5px solid ${pending>0?"#F09595":"#ddd"}`,borderRadius:6,padding:"8px 10px"}}>
                        <span style={{fontSize:13,color:pending>0?"#A32D2D":"#666",display:"block",marginBottom:2}}>Pendiente</span>
                        <span style={{fontSize:17,fontWeight:500,color:pending>0?"#A32D2D":"#111"}}>€{fmtCur(Math.max(0,pending))}</span>
                      </div>
                    </div>
                    {paid > 0 && (
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                        <div style={{background:"#fff",border:"0.5px solid #ddd",borderRadius:6,padding:"7px 10px",display:"flex",alignItems:"center",gap:8}}>
                          <span style={{fontSize:18}}>💵</span>
                          <div>
                            <span style={{fontSize:12,color:"#666",display:"block"}}>Efectivo</span>
                            <span style={{fontSize:16,fontWeight:600}}>€{fmtCur(totalEf)}</span>
                          </div>
                        </div>
                        <div style={{background:"#fff",border:"0.5px solid #ddd",borderRadius:6,padding:"7px 10px",display:"flex",alignItems:"center",gap:8}}>
                          <span style={{fontSize:18}}>📱</span>
                          <div>
                            <span style={{fontSize:12,color:"#666",display:"block"}}>Bizum / Transf.</span>
                            <span style={{fontSize:16,fontWeight:600}}>€{fmtCur(totalBiz)}</span>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })()}

              {field("Estado", <select style={inp} value={form.status} onChange={e=>setForm(f=>({...f,status:e.target.value}))}>{PAYMENT_STATUS.map(p=><option key={p}>{p}</option>)}</select>)}
              {field("Notas", <textarea rows={2} style={{...inp,resize:"vertical"}} value={form.notes||""} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Detalles adicionales..." />)}
            </> : <>
              {field("Descripción", <input style={inp} value={form.label||""} onChange={e=>setForm(f=>({...f,label:e.target.value}))} placeholder="Ej: Reunión, Trámite..." />)}
              {field("Fecha", <input type="date" style={inp} value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))} />)}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                {field("Desde", <select style={inp} value={form.time||""} onChange={e=>setForm(f=>({...f,time:e.target.value}))}><option value="">--</option>{ALL_SLOTS.map(s=><option key={s}>{s}</option>)}</select>)}
                {field("Hasta", <select style={inp} value={form.timeTo||""} onChange={e=>setForm(f=>({...f,timeTo:e.target.value}))}><option value="">--</option>{ALL_SLOTS.map(s=><option key={s}>{s}</option>)}</select>)}
              </div>
              {field("Notas", <textarea rows={2} style={{...inp,resize:"vertical"}} value={form.notes||""} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Detalles adicionales..." />)}
            </>}

            <div style={{display:"flex",justifyContent:"space-between",gap:8,marginTop:8}}>
              {form.id && sessions.find(s=>s.id===form.id) && (
                <button onClick={()=>{setModal(null);setForm(null);setDeleteConfirm({id:form.id,type:formType});}} style={{padding:"8px 16px",fontSize:16,border:"0.5px solid #E24B4A",borderRadius:6,background:"none",cursor:"pointer",color:"#E24B4A"}}>Eliminar</button>
              )}
              <div style={{display:"flex",gap:8,marginLeft:"auto"}}>
                <button onClick={()=>{setModal(null);setForm(null);}} style={{padding:"8px 16px",fontSize:16,border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666"}}>Cancelar</button>
                {formType==="session" && (
                  <button onClick={()=>{
                    // Save session first, then open invoice modal pre-filled
                    saveForm();
                    const bizum = Number(form.depositBizum||0)+Number(form.sessionBizum||0);
                    const total  = Number(form.total||0);
                    // Only offer invoice if there's a bizum payment
                    const invTotal = bizum > 0 ? bizum : total;
                    const year = new Date().getFullYear();
                    const count = invoices.filter(i=>i.num&&i.num.startsWith(String(year))).length;
                    const num = `${year}/${pad3(count+1)}`;
                    setInvoiceModal({
                      id: Date.now(),
                      num,
                      date: form.date||"",
                      client: "CLIENTES VARIOS",
                      concept: form.type,
                      total: String(invTotal),
                      notes: "",
                    });
                  }} style={{padding:"8px 16px",fontSize:16,border:"0.5px solid #0A558C",borderRadius:6,background:INVOICE_COLOR.bg,cursor:"pointer",color:"#0A558C",fontWeight:500}}>
                    🧾 Guardar y facturar
                  </button>
                )}
                <button onClick={saveForm} style={{padding:"8px 16px",fontSize:16,border:"none",borderRadius:6,background:"#111",color:"#fff",cursor:"pointer",fontWeight:500}}>Guardar</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {deleteConfirm && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}>
          <div style={{background:"#ffffff",color:"#111",borderRadius:10,padding:"1.5rem",width:"100%",maxWidth:300,border:"0.5px solid #ddd"}}>
            <p style={{margin:"0 0 1rem",fontSize:17}}>¿Eliminar este registro?</p>
            <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
              <button onClick={()=>setDeleteConfirm(null)} style={{padding:"8px 16px",fontSize:16,border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666"}}>Cancelar</button>
              <button onClick={()=>del(deleteConfirm)} style={{padding:"8px 16px",fontSize:16,border:"none",borderRadius:6,background:"#E24B4A",color:"#fff",cursor:"pointer",fontWeight:500}}>Eliminar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function SlotCell({ slot, items, onAdd, onBlock, onEdit, onDelete }) {
  const [hover, setHover] = useState(false);
  return (
    <div onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      style={{border:"0.5px solid #e5e5e5",borderRadius:6,padding:"6px 8px",minHeight:56,background:"#ffffff"}}>
      <div style={{fontSize:13,fontWeight:500,color:"#666",marginBottom:4}}>{slot}</div>
      {items.map(item=>(
        <div key={item.id} style={{fontSize:13,borderRadius:3,padding:"2px 6px",marginBottom:2,
          background:item._type==="block"?BLOCK_COLOR.bg:STATUS_COLORS[item.status]?.bg,
          color:item._type==="block"?BLOCK_COLOR.text:STATUS_COLORS[item.status]?.text,
          display:"flex",justifyContent:"space-between",alignItems:"center",gap:4}}>
          <span style={{overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",flex:1,cursor:"pointer"}} onClick={()=>onEdit(item)}>
            {item._type==="block"?item.label:item.client||"Sin nombre"}
          </span>
          <span onClick={()=>onDelete(item.id)} style={{cursor:"pointer",opacity:0.5,flexShrink:0}}>×</span>
        </div>
      ))}
      {items.length===0 && hover && (
        <div style={{display:"flex",gap:3,marginTop:2}}>
          <button onClick={onAdd}   style={{flex:1,fontSize:12,padding:"2px 0",border:"0.5px solid #222",borderRadius:4,background:"#111",cursor:"pointer",color:"#fff"}}>+ Sesión</button>
          <button onClick={onBlock} style={{flex:1,fontSize:12,padding:"2px 0",border:"0.5px solid #ccc",borderRadius:4,background:"none",cursor:"pointer",color:BLOCK_COLOR.text}}>Bloquear</button>
        </div>
      )}
      {items.length===0 && !hover && <div style={{fontSize:12,color:"#666",opacity:0.4}}>Libre</div>}
    </div>
  );
}

function ListItem({ item, onEdit, onDelete }) {
  const sc = item._type==="block"?BLOCK_COLOR:(STATUS_COLORS[item.status]||STATUS_COLORS.Pendiente);
  const d = item.date?new Date(item.date+"T00:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"short",year:"numeric"}):"";
  return (
    <div style={{background:"#ffffff",border:"0.5px solid #e5e5e5",borderRadius:10,padding:"10px 14px",display:"flex",gap:10,alignItems:"flex-start"}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:2}}>
          <span style={{fontWeight:500,fontSize:16}}>{item._type==="block"?item.label:item.client||"Sin nombre"}</span>
          <span style={{fontSize:12,padding:"2px 7px",borderRadius:20,background:sc.bg,color:sc.text,border:`0.5px solid ${sc.border}`}}>{item._type==="block"?"Bloque":item.status}</span>
          {item._type!=="block"&&<span style={{fontSize:12,padding:"2px 7px",borderRadius:20,background:"#f5f5f5",color:"#666"}}>{item.type}</span>}
        </div>
        <p style={{margin:0,fontSize:14,color:"#666"}}>{d}{item.time?" · "+item.time:""}{item._type==="block"&&item.timeTo?" – "+item.timeTo:""}</p>
        {item._type!=="block" && <>
          <p style={{margin:"3px 0 0",fontSize:14}}>Total: €{fmtCur(item.total)} · Cobrado: €{fmtCur(item.paid||0)}</p>
          {item.phone && <p style={{margin:"2px 0 0",fontSize:14,color:"#666"}}>📞 {item.phone}</p>}
        </>}
      </div>
      <div style={{display:"flex",gap:5,flexShrink:0}}>
        <button onClick={()=>onEdit(item)} style={{fontSize:14,padding:"4px 9px",border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666"}}>Editar</button>
        <button onClick={()=>onDelete(item.id)} style={{fontSize:14,padding:"4px 9px",border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#c00"}}>×</button>
      </div>
    </div>
  );
}

// ── Expense Modal with AI invoice reader ────────────────────────────────────
function ExpenseModal({ expenseForm, setExpenseForm, expenses, setExpenses, inp, field, EXPENSE_CATS }) {
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState("");
  const [preview, setPreview] = useState(expenseForm._previewUrl || null);
  const isEdit = expenses.find(e => e.id === expenseForm.id);

  const fileToBase64 = file => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });

  const handleFile = async (file) => {
    if (!file) return;
    setScanError("");
    // preview
    const objectUrl = URL.createObjectURL(file);
    setPreview(objectUrl);
    setExpenseForm(f => ({ ...f, _previewUrl: objectUrl, _fileName: file.name }));

    setScanning(true);
    try {
      const isPdf = file.type === "application/pdf";
      const base64 = await fileToBase64(file);
      const mediaType = isPdf ? "application/pdf" : file.type;

      const body = {
        model: "claude-sonnet-4-20250514",
        max_tokens: 500,
        messages: [{
          role: "user",
          content: [
            {
              type: isPdf ? "document" : "image",
              source: { type: "base64", media_type: mediaType, data: base64 },
            },
            {
              type: "text",
              text: `Eres un asistente de contabilidad. Extrae de esta factura los siguientes campos y responde ÚNICAMENTE con JSON válido, sin texto adicional, sin markdown:
{
  "description": "descripción breve del gasto (proveedor + concepto, máx 60 chars)",
  "base": número con decimales (base imponible sin IVA, en euros),
  "iva": número con decimales (importe del IVA en euros, no el porcentaje),
  "amount": número con decimales (importe TOTAL con IVA = base + iva, en euros),
  "ivaRate": número (tipo de IVA en porcentaje, ej: 21),
  "date": "YYYY-MM-DD",
  "category": una de estas exactamente: "Material fotográfico","Software / suscripciones","Desplazamientos","Local / alquiler","Marketing / publicidad","Formación","Seguros","Gestoría / asesoría","Otros",
  "notes": "nº factura u otros datos útiles"
}
Si no encuentras un campo, usa null. Todos los importes deben ser números, no strings.`
            }
          ]
        }]
      };

      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      const text = data.content?.map(c => c.text || "").join("") || "";
      const clean = text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);

      setExpenseForm(f => ({
        ...f,
        description: parsed.description || f.description,
        base:        parsed.base != null ? String(parsed.base) : f.base,
        iva:         parsed.iva  != null ? String(parsed.iva)  : f.iva,
        amount:      parsed.amount != null ? String(parsed.amount) : f.amount,
        ivaRate:     parsed.ivaRate != null ? parsed.ivaRate : f.ivaRate,
        date:        parsed.date || f.date,
        category:    parsed.category || f.category,
        notes:       parsed.notes || f.notes,
      }));
    } catch (err) {
      setScanError("No se pudo leer la factura automáticamente. Rellena los campos manualmente.");
    } finally {
      setScanning(false);
    }
  };

  const handleDrop = e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  };

  const save = () => {
    const toSave = { ...expenseForm };
    delete toSave._previewUrl;
    delete toSave._fileName;
    setExpenses(ex => ex.find(e => e.id === toSave.id) ? ex.map(e => e.id === toSave.id ? toSave : e) : [...ex, toSave]);
    setExpenseForm(null);
  };

  const fmtCur = n => Number(n||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2});

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:110,padding:16}}>
      <div style={{background:"#ffffff",color:"#111",borderRadius:10,width:"100%",maxWidth:560,maxHeight:"92vh",overflowY:"auto",border:"0.5px solid #ddd",display:"flex",flexDirection:"column"}}>

        {/* Header */}
        <div style={{padding:"14px 20px",borderBottom:"0.5px solid #e5e5e5",display:"flex",justifyContent:"space-between",alignItems:"center",background:"#f5f5f5",borderRadius:"10px 10px 0 0"}}>
          <span style={{fontWeight:500,fontSize:17}}>
            {isEdit ? "✎ Editar gasto" : "💸 Nuevo gasto"}
          </span>
          <button onClick={()=>setExpenseForm(null)} style={{fontSize:20,border:"none",background:"none",cursor:"pointer",color:"#666"}}>×</button>
        </div>

        <div style={{padding:"16px 20px",display:"flex",flexDirection:"column",gap:0}}>

          {/* Drop zone / upload */}
          <div
            onDrop={handleDrop}
            onDragOver={e=>e.preventDefault()}
            style={{border:"1.5px dashed #ccc",borderRadius:6,padding:"14px",marginBottom:14,background:"#f5f5f5",textAlign:"center",position:"relative"}}>
            {scanning ? (
              <div style={{padding:"8px 0"}}>
                <div style={{fontSize:24,marginBottom:6}}>🔍</div>
                <p style={{margin:0,fontSize:15,fontWeight:500}}>Leyendo factura con IA…</p>
                <p style={{margin:"4px 0 0",fontSize:13,color:"#666"}}>Extrayendo importe, fecha y descripción</p>
              </div>
            ) : preview ? (
              <div style={{display:"flex",alignItems:"center",gap:10,textAlign:"left"}}>
                {expenseForm._fileName?.endsWith(".pdf") || expenseForm._previewUrl?.includes("pdf") ? (
                  <div style={{fontSize:32,flexShrink:0}}>📄</div>
                ) : (
                  <img src={preview} alt="factura" style={{width:56,height:56,objectFit:"cover",borderRadius:6,flexShrink:0,border:"0.5px solid #e5e5e5"}}/>
                )}
                <div style={{flex:1,minWidth:0}}>
                  <p style={{margin:0,fontSize:14,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{expenseForm._fileName||"Factura adjunta"}</p>
                  <p style={{margin:"2px 0 0",fontSize:13,color:"#3B6D11"}}>✓ Datos extraídos — revisa y ajusta si es necesario</p>
                </div>
                <label style={{fontSize:13,padding:"3px 8px",border:"0.5px solid #ccc",borderRadius:6,cursor:"pointer",color:"#666",flexShrink:0}}>
                  Cambiar
                  <input type="file" accept="application/pdf,image/*" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
                </label>
              </div>
            ) : (
              <label style={{cursor:"pointer",display:"block"}}>
                <div style={{fontSize:28,marginBottom:4}}>📎</div>
                <p style={{margin:0,fontSize:15,fontWeight:500,color:"#111"}}>Sube la factura en PDF o imagen</p>
                <p style={{margin:"4px 0 6px",fontSize:13,color:"#666"}}>Arrastra aquí o haz clic · La IA extraerá los datos automáticamente</p>
                <span style={{fontSize:13,padding:"4px 12px",border:"0.5px solid #222",borderRadius:6,background:"#111",color:"#fff",display:"inline-block"}}>Seleccionar archivo</span>
                <input type="file" accept="application/pdf,image/*" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
              </label>
            )}
          </div>

          {scanError && <p style={{margin:"0 0 10px",fontSize:14,color:"#c00",background:"#FCEBEB",padding:"6px 10px",borderRadius:6}}>{scanError}</p>}

          {/* Fields */}
          {field("Descripción", <input style={inp} value={expenseForm.description||""} onChange={e=>setExpenseForm(f=>({...f,description:e.target.value}))} placeholder="Ej: Nuevo objetivo 50mm" />)}
          {field("Categoría", <select style={inp} value={expenseForm.category} onChange={e=>setExpenseForm(f=>({...f,category:e.target.value}))}>{EXPENSE_CATS.map(c=><option key={c}>{c}</option>)}</select>)}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {field("Fecha", <input type="date" style={inp} value={expenseForm.date||""} onChange={e=>setExpenseForm(f=>({...f,date:e.target.value}))} />)}
            {field("Tipo IVA (%)", <input type="number" min="0" max="100" style={inp} value={expenseForm.ivaRate||""} onChange={e=>{
              const rate = Number(e.target.value);
              const base = Number(expenseForm.base||0);
              setExpenseForm(f=>({...f, ivaRate:e.target.value, iva: base>0 ? String((base*rate/100).toFixed(2)) : f.iva, amount: base>0 ? String((base*(1+rate/100)).toFixed(2)) : f.amount }));
            }} placeholder="21" />)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
            {field("Base imponible (€)", <input type="number" min="0" step="0.01" style={inp} value={expenseForm.base||""} onChange={e=>{
              const base = Number(e.target.value);
              const rate = Number(expenseForm.ivaRate||0);
              const iva  = base * rate / 100;
              setExpenseForm(f=>({...f, base:e.target.value, iva:iva>0?String(iva.toFixed(2)):f.iva, amount:String((base+iva).toFixed(2))}));
            }} placeholder="0.00" />)}
            {field("IVA (€)", <input type="number" min="0" step="0.01" style={{...inp, background: expenseForm.iva ? "#FAEEDA" : "#fff"}} value={expenseForm.iva||""} onChange={e=>{
              const iva  = Number(e.target.value);
              const base = Number(expenseForm.base||0);
              setExpenseForm(f=>({...f, iva:e.target.value, amount:String((base+iva).toFixed(2))}));
            }} placeholder="0.00" />)}
            {field("Total (€)", <input type="number" min="0" step="0.01" style={inp} value={expenseForm.amount||""} onChange={e=>setExpenseForm(f=>({...f,amount:e.target.value}))} placeholder="0.00" />)}
          </div>

          {/* Live IVA summary */}
          {(Number(expenseForm.base)>0 || Number(expenseForm.iva)>0) && (
            <div style={{background:"#FAEEDA",border:"0.5px solid #EF9F27",borderRadius:6,padding:"10px 14px",marginBottom:12}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                {[
                  {label:"Base imponible", value:expenseForm.base, color:"#111"},
                  {label:"IVA"+(expenseForm.ivaRate?` (${expenseForm.ivaRate}%)`:""), value:expenseForm.iva, color:"#854F0B"},
                  {label:"Total factura", value:expenseForm.amount, color:"#111"},
                ].map(c=>(
                  <div key={c.label}>
                    <p style={{margin:0,fontSize:12,color:"#854F0B"}}>{c.label}</p>
                    <p style={{margin:0,fontSize:17,fontWeight:600,color:c.color}}>€{fmtCur(c.value)}</p>
                  </div>
                ))}
              </div>
            </div>
          )}

          {field("Notas", <textarea rows={2} style={{...inp,resize:"vertical"}} value={expenseForm.notes||""} onChange={e=>setExpenseForm(f=>({...f,notes:e.target.value}))} placeholder="Nº factura, proveedor, detalles..." />)}

          {/* Actions */}
          <div style={{display:"flex",justifyContent:"space-between",gap:8,marginTop:4}}>
            {isEdit && (
              <button onClick={()=>{setExpenses(ex=>ex.filter(e=>e.id!==expenseForm.id));setExpenseForm(null);}} style={{padding:"8px 14px",fontSize:16,border:"0.5px solid #E24B4A",borderRadius:6,background:"none",cursor:"pointer",color:"#E24B4A"}}>Eliminar</button>
            )}
            <div style={{display:"flex",gap:8,marginLeft:"auto"}}>
              <button onClick={()=>setExpenseForm(null)} style={{padding:"8px 16px",fontSize:16,border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666"}}>Cancelar</button>
              <button onClick={save} disabled={scanning} style={{padding:"8px 16px",fontSize:16,border:"none",borderRadius:6,background:scanning?"#999":"#111",color:"#fff",cursor:scanning?"not-allowed":"pointer",fontWeight:500}}>
                {scanning ? "Procesando…" : "Guardar"}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Bulk Invoice Modal ───────────────────────────────────────────────────────
function BulkInvoiceModal({ onClose, onSaveAll, EXPENSE_CATS }) {
  // Each item: { id, file, fileName, status: 'pending'|'scanning'|'done'|'error', data:{...}, editing }
  const [items, setItems] = useState([]);
  const [saving, setSaving] = useState(false);

  const fmtCur = n => Number(n||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2});
  const inp = {background:"#fff",border:"0.5px solid #aaa",borderRadius:6,padding:"5px 8px",fontSize:15,width:"100%",color:"#111",boxSizing:"border-box"};

  const fileToBase64 = file => new Promise((res,rej)=>{
    const r = new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(file);
  });

  const scanFile = async (item) => {
    setItems(its=>its.map(x=>x.id===item.id?{...x,status:"scanning"}:x));
    try {
      const isPdf = item.file.type==="application/pdf";
      const base64 = await fileToBase64(item.file);
      const mediaType = isPdf?"application/pdf":item.file.type;
      const body = {
        model:"claude-sonnet-4-20250514",
        max_tokens:500,
        messages:[{role:"user",content:[
          { type:isPdf?"document":"image", source:{type:"base64",media_type:mediaType,data:base64} },
          { type:"text", text:`Extrae de esta factura los siguientes campos y responde ÚNICAMENTE con JSON válido sin markdown:
{"description":"descripción breve proveedor+concepto máx 60 chars","base":número_base_imponible_sin_IVA,"iva":número_importe_IVA_en_euros,"ivaRate":número_porcentaje_IVA,"amount":número_total_con_IVA,"date":"YYYY-MM-DD","category":"una de: Material fotográfico|Software / suscripciones|Desplazamientos|Local / alquiler|Marketing / publicidad|Formación|Seguros|Gestoría / asesoría|Otros","notes":"nº factura u otros datos útiles"}
Si no encuentras un campo usa null. Todos los importes deben ser números.` }
        ]}]
      };
      const res = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const d = await res.json();
      const text = d.content?.map(c=>c.text||"").join("")||"";
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      setItems(its=>its.map(x=>x.id===item.id?{...x,status:"done",data:{
        description: parsed.description||"",
        base:    parsed.base    != null ? String(parsed.base)    : "",
        iva:     parsed.iva     != null ? String(parsed.iva)     : "",
        ivaRate: parsed.ivaRate != null ? String(parsed.ivaRate) : "",
        amount:  parsed.amount  != null ? String(parsed.amount)  : "",
        date:    parsed.date||"",
        category: parsed.category||"Otros",
        notes:   parsed.notes||"",
      }}:x));
    } catch {
      setItems(its=>its.map(x=>x.id===item.id?{...x,status:"error",data:{description:"",amount:"",date:"",category:"Otros",notes:""}}:x));
    }
  };

  const addFiles = async (files) => {
    const newItems = Array.from(files).map(f=>({
      id: Date.now()+Math.random(),
      file: f,
      fileName: f.name,
      status: "pending",
      data: {description:"",base:"",iva:"",ivaRate:"",amount:"",date:"",category:"Otros",notes:""},
      previewUrl: f.type.startsWith("image/") ? URL.createObjectURL(f) : null,
    }));
    setItems(its=>[...its,...newItems]);
    // scan sequentially
    for(const item of newItems) await scanFile(item);
  };

  const updateData = (id, key, val) => setItems(its=>its.map(x=>x.id===id?{...x,data:{...x.data,[key]:val}}:x));
  const removeItem = (id) => setItems(its=>its.filter(x=>x.id!==id));

  const readyCount = items.filter(x=>x.status==="done"||x.status==="error").length;
  const doneCount  = items.filter(x=>x.status==="done").length;
  const totalAmt   = items.filter(x=>x.status==="done").reduce((a,x)=>a+Number(x.data.amount||0),0);

  const handleSaveAll = () => {
    const toSave = items.filter(x=>x.data.description||x.data.amount).map(x=>({
      id: Date.now()+Math.random(),
      description: x.data.description||x.fileName,
      base:        x.data.base,
      iva:         x.data.iva,
      ivaRate:     x.data.ivaRate,
      amount:      x.data.amount,
      date:        x.data.date,
      category:    x.data.category||"Otros",
      notes:       x.data.notes,
    }));
    onSaveAll(toSave);
  };

  const STATUS_ICON = { pending:"⏳", scanning:"🔍", done:"✓", error:"⚠️" };
  const STATUS_COLOR = { pending:"#aaa", scanning:"#3C3489", done:"#3B6D11", error:"#993C1D" };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:120,padding:16}}>
      <div style={{background:"#ffffff",color:"#111",borderRadius:12,width:"100%",maxWidth:680,maxHeight:"92vh",display:"flex",flexDirection:"column",border:"0.5px solid #ddd"}}>

        {/* Header */}
        <div style={{padding:"14px 20px",borderBottom:"0.5px solid #e5e5e5",display:"flex",justifyContent:"space-between",alignItems:"center",background:"#f5f5f5",borderRadius:"12px 12px 0 0",flexShrink:0}}>
          <div>
            <span style={{fontWeight:500,fontSize:17}}>📎 Subir varias facturas</span>
            {items.length>0 && <span style={{fontSize:14,color:"#666",marginLeft:10}}>{readyCount}/{items.length} procesadas · {doneCount} con datos</span>}
          </div>
          <button onClick={onClose} style={{fontSize:20,border:"none",background:"none",cursor:"pointer",color:"#666"}}>×</button>
        </div>

        {/* Drop zone */}
        <div
          onDrop={e=>{e.preventDefault();addFiles(e.dataTransfer.files);}}
          onDragOver={e=>e.preventDefault()}
          style={{margin:"16px 20px 0",border:"1.5px dashed #ccc",borderRadius:8,padding:"16px",background:"#f5f5f5",textAlign:"center",flexShrink:0}}>
          <label style={{cursor:"pointer",display:"block"}}>
            <div style={{fontSize:24,marginBottom:4}}>📂</div>
            <p style={{margin:0,fontSize:15,fontWeight:500}}>Arrastra aquí todos los PDFs o imágenes</p>
            <p style={{margin:"4px 0 8px",fontSize:13,color:"#666"}}>O haz clic para seleccionar · Puedes elegir varios a la vez</p>
            <span style={{fontSize:14,padding:"5px 14px",border:"0.5px solid #222",borderRadius:6,background:"#111",color:"#fff",display:"inline-block"}}>Seleccionar archivos</span>
            <input type="file" accept="application/pdf,image/*" multiple style={{display:"none"}} onChange={e=>addFiles(e.target.files)}/>
          </label>
        </div>

        {/* Items list */}
        <div style={{flex:1,overflowY:"auto",padding:"12px 20px",display:"flex",flexDirection:"column",gap:8}}>
          {items.length===0 && (
            <p style={{textAlign:"center",color:"#666",fontSize:15,padding:"1.5rem 0"}}>Sube facturas arriba para empezar.</p>
          )}
          {items.map(item=>(
            <div key={item.id} style={{border:"0.5px solid #e5e5e5",borderRadius:8,overflow:"hidden",background:"#ffffff"}}>
              {/* Item header */}
              <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"#f5f5f5",borderBottom:item.status==="done"||item.status==="error"?"0.5px solid #e5e5e5":"none"}}>
                {item.previewUrl
                  ? <img src={item.previewUrl} alt="" style={{width:32,height:32,objectFit:"cover",borderRadius:4,flexShrink:0}}/>
                  : <div style={{width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>📄</div>
                }
                <div style={{flex:1,minWidth:0}}>
                  <p style={{margin:0,fontSize:14,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.fileName}</p>
                  <p style={{margin:0,fontSize:13,color:STATUS_COLOR[item.status]}}>
                    {STATUS_ICON[item.status]} {item.status==="pending"?"En cola…":item.status==="scanning"?"Leyendo con IA…":item.status==="done"?"Datos extraídos":"No se pudo leer — rellena manualmente"}
                  </p>
                </div>
                {item.status==="done" && item.data.amount && (
                  <span style={{fontSize:16,fontWeight:600,color:"#854F0B",flexShrink:0}}>€{fmtCur(item.data.amount)}</span>
                )}
                <button onClick={()=>removeItem(item.id)} style={{fontSize:16,border:"none",background:"none",cursor:"pointer",color:"#666",flexShrink:0}}>×</button>
              </div>

              {/* Editable fields when done or error */}
              {(item.status==="done"||item.status==="error") && (
                <div style={{padding:"10px 12px",display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:8}}>
                  <input style={inp} value={item.data.description} onChange={e=>updateData(item.id,"description",e.target.value)} placeholder="Descripción" />
                  <input type="date" style={inp} value={item.data.date} onChange={e=>updateData(item.id,"date",e.target.value)} />
                  <input type="number" style={inp} value={item.data.base} onChange={e=>updateData(item.id,"base",e.target.value)} placeholder="Base €" />
                  <input type="number" style={{...inp, background: item.data.iva ? "#FAEEDA" : "#fff"}} value={item.data.iva} onChange={e=>updateData(item.id,"iva",e.target.value)} placeholder="IVA €" />
                  <select style={{...inp,gridColumn:"1 / 3"}} value={item.data.category} onChange={e=>updateData(item.id,"category",e.target.value)}>
                    {EXPENSE_CATS.map(c=><option key={c}>{c}</option>)}
                  </select>
                  <input type="number" style={inp} value={item.data.amount} onChange={e=>updateData(item.id,"amount",e.target.value)} placeholder="Total €" />
                  {item.data.ivaRate && <span style={{fontSize:13,color:"#854F0B",alignSelf:"center"}}>IVA {item.data.ivaRate}%</span>}
                </div>
              )}
            </div>
          ))}
        </div>

        {/* Footer */}
        <div style={{padding:"12px 20px",borderTop:"0.5px solid #e5e5e5",display:"flex",justifyContent:"space-between",alignItems:"center",background:"#f5f5f5",borderRadius:"0 0 12px 12px",flexShrink:0}}>
          <div>
            {doneCount>0 && <span style={{fontSize:15,fontWeight:500}}>{doneCount} factura{doneCount!==1?"s":""} · Total: <span style={{color:"#854F0B"}}>€{fmtCur(totalAmt)}</span></span>}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={onClose} style={{padding:"8px 16px",fontSize:16,border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666"}}>Cancelar</button>
            <button
              onClick={handleSaveAll}
              disabled={doneCount===0&&items.filter(x=>x.data.description||x.data.amount).length===0}
              style={{padding:"8px 16px",fontSize:16,border:"none",borderRadius:6,background:"#111",color:"#fff",cursor:"pointer",fontWeight:500,opacity:doneCount===0?0.5:1}}>
              Guardar {doneCount>0?`${doneCount} gasto${doneCount!==1?"s":""}`:""} →
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── IVA Liquidación ─────────────────────────────────────────────────────────
function IvaBlock({ qPaid, qExpTotal, qSessions, qExpenses, fmtCur, qInvoices=[], qInvoicesTotal=0, qInvoicesBase=0, qInvoicesIva=0 }) {
  const [ivaInRate,       setIvaInRate]       = useState(21);
  const [ivaFallbackRate, setIvaFallbackRate] = useState(21);
  const [showDetail,      setShowDetail]      = useState(false);

  // ── INGRESOS ─────────────────────────────────────────────────────────────
  // Prefer invoices (they have exact IVA). Fall back to sessions if no invoices.
  const useInvoices = qInvoices.length > 0;
  const baseIngresos   = useInvoices ? qInvoicesBase   : qPaid / (1 + ivaInRate/100);
  const ivaRepercutido = useInvoices ? qInvoicesIva    : qPaid - baseIngresos;
  const totalIngresos  = useInvoices ? qInvoicesTotal  : qPaid;

  // ── GASTOS ────────────────────────────────────────────────────────────────
  // Para cada gasto: si tiene iva leído → usarlo; si no → calcular del total (total incluye IVA)
  const expensesWithIva = qExpenses.map(e => {
    const amount = Number(e.amount||0);
    const ivaLeido = Number(e.iva||0);
    if(ivaLeido > 0) {
      // IVA leído directamente de la factura
      return { ...e, _ivaCalc: ivaLeido, _baseCalc: amount - ivaLeido, _source: "factura" };
    } else {
      // IVA estimado: el amount ya lleva IVA incluido → extraemos
      const base = amount / (1 + ivaFallbackRate/100);
      const iva  = amount - base;
      return { ...e, _ivaCalc: iva, _baseCalc: base, _source: "estimado" };
    }
  });

  const gastosConIva  = expensesWithIva.filter(e => e._source === "factura");
  const gastosSinIva  = expensesWithIva.filter(e => e._source === "estimado");
  const ivaLeidoReal  = gastosConIva.reduce((a,e)  => a + e._ivaCalc, 0);
  const ivaEstimado   = gastosSinIva.reduce((a,e)  => a + e._ivaCalc, 0);
  const ivaSoportado  = ivaLeidoReal + ivaEstimado;
  const baseGastos    = expensesWithIva.reduce((a,e) => a + e._baseCalc, 0);

  const ivaLiquidar = ivaRepercutido - ivaSoportado;
  const sign   = ivaLiquidar >= 0 ? "A pagar" : "A compensar / devolver";
  const color  = ivaLiquidar >= 0 ? "#854F0B" : "#3B6D11";
  const bg     = ivaLiquidar >= 0 ? "#FAEEDA" : "#EAF3DE";
  const border = ivaLiquidar >= 0 ? "#EF9F27" : "#97C459";

  const RateButtons = ({value, onChange}) => (
    <div style={{display:"flex",gap:3}}>
      {[0,4,10,21].map(v=>(
        <button key={v} onClick={()=>onChange(v)}
          style={{padding:"3px 8px",fontSize:14,border:"0.5px solid "+(value===v?"#222":"#ccc"),borderRadius:5,background:value===v?"#111":"none",color:value===v?"#fff":"#666",cursor:"pointer"}}>
          {v}%
        </button>
      ))}
    </div>
  );

  const Row = ({label, base, iva, c, sub}) => (
    <div style={{display:"grid",gridTemplateColumns:"1fr 110px 110px 110px",gap:8,padding:"9px 14px",borderBottom:"0.5px solid #e5e5e5",alignItems:"center"}}>
      <div>
        <span style={{fontSize:15}}>{label}</span>
        {sub && <p style={{margin:0,fontSize:12,color:"#666"}}>{sub}</p>}
      </div>
      <span style={{fontSize:15,textAlign:"right"}}>€{fmtCur(base)}</span>
      <span style={{fontSize:15,textAlign:"right",color:c,fontWeight:500}}>€{fmtCur(iva)}</span>
      <span style={{fontSize:15,textAlign:"right",fontWeight:500}}>€{fmtCur(base+iva)}</span>
    </div>
  );

  return (
    <div style={{marginTop:16,border:"0.5px solid #e5e5e5",borderRadius:10,overflow:"hidden"}}>
      {/* Header */}
      <div style={{padding:"10px 14px",borderBottom:"0.5px solid #e5e5e5",background:"#f5f5f5"}}>
        <span style={{fontSize:15,fontWeight:500}}>🧾 Liquidación de IVA · Modelo 303</span>
      </div>

      {/* Rate selectors — only show IVA ingresos selector if NOT using invoices */}
      <div style={{padding:"10px 14px",borderBottom:"0.5px solid #e5e5e5",background:"#ffffff",display:"flex",gap:20,flexWrap:"wrap",alignItems:"center"}}>
        {useInvoices ? (
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:20}}>✅</span>
            <span style={{fontSize:14,color:"#3B6D11",fontWeight:500}}>
              IVA de ingresos leído de {qInvoices.length} factura{qInvoices.length!==1?"s":""} emitida{qInvoices.length!==1?"s":""} · Total IVA repercutido: <strong>€{fmtCur(ivaRepercutido)}</strong>
            </span>
          </div>
        ) : (
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:14,color:"#666",whiteSpace:"nowrap"}}>IVA ingresos (estimado de sesiones):</span>
            <RateButtons value={ivaInRate} onChange={setIvaInRate}/>
          </div>
        )}
        {gastosSinIva.length > 0 && (
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:14,color:"#854F0B",whiteSpace:"nowrap"}}>
              IVA estimado para {gastosSinIva.length} gasto{gastosSinIva.length!==1?"s":""} sin factura:
            </span>
            <RateButtons value={ivaFallbackRate} onChange={setIvaFallbackRate}/>
          </div>
        )}
      </div>

      {/* Table header */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 110px 110px 110px",gap:8,padding:"7px 14px",background:"#f5f5f5",borderBottom:"0.5px solid #e5e5e5"}}>
        {["Concepto","Base imponible","IVA","Total"].map(h=>(
          <span key={h} style={{fontSize:13,fontWeight:500,color:"#666",textAlign:h==="Concepto"?"left":"right"}}>{h}</span>
        ))}
      </div>

      {/* Ingresos */}
      <Row label={useInvoices ? `🧾 Ingresos facturados (${qInvoices.length} facturas emitidas)` : "📷 Ingresos cobrados (sesiones)"}
        sub={useInvoices ? `IVA al 21% leído de las facturas emitidas del trimestre` : `IVA repercutido al ${ivaInRate}% sobre total cobrado`}
        base={baseIngresos} iva={ivaRepercutido} c="#3B6D11" />

      {/* Gastos */}
      <Row label="💸 Gastos deducibles"
        sub={`${gastosConIva.length} con IVA de factura · ${gastosSinIva.length} con IVA calculado al ${ivaFallbackRate}% (total incluye IVA)`}
        base={baseGastos} iva={ivaSoportado} c="#E24B4A" />

      {/* Info sobre método de cálculo */}
      {gastosSinIva.length > 0 && (
        <div style={{padding:"8px 14px",background:"#FAEEDA",borderBottom:"0.5px solid #EF9F27",display:"flex",gap:8,alignItems:"flex-start"}}>
          <span style={{fontSize:16,flexShrink:0}}>ℹ️</span>
          <p style={{margin:0,fontSize:14,color:"#854F0B"}}>
            <strong>{gastosSinIva.length} gasto{gastosSinIva.length!==1?"s":""} sin IVA desglosado en factura</strong> — IVA calculado extrayendo el {ivaFallbackRate}% del total (asumiendo total con IVA incluido).
            {ivaLeidoReal > 0 && <span style={{display:"block",marginTop:2}}>IVA leído de facturas: €{fmtCur(ivaLeidoReal)} · IVA calculado del resto: €{fmtCur(ivaEstimado)}</span>}
          </p>
        </div>
      )}

      {/* Detalle por gasto — toggle */}
      <div style={{padding:"8px 14px",borderBottom:"0.5px solid #e5e5e5",display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fafafa"}}>
        <span style={{fontSize:14,color:"#666"}}>Desglose por gasto</span>
        <button onClick={()=>setShowDetail(v=>!v)} style={{fontSize:14,padding:"3px 9px",border:"0.5px solid #ccc",borderRadius:5,background:"none",cursor:"pointer",color:"#444"}}>
          {showDetail?"Ocultar ▲":"Ver detalle ▼"}
        </button>
      </div>
      {showDetail && (
        <div style={{borderBottom:"0.5px solid #e5e5e5"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 80px 80px 80px 60px",gap:4,padding:"6px 14px",background:"#f5f5f5",borderBottom:"0.5px solid #e5e5e5"}}>
            {["Descripción","Total","Base","IVA","Fuente"].map(h=>(
              <span key={h} style={{fontSize:12,fontWeight:600,color:"#666",textAlign:h==="Descripción"?"left":"right"}}>{h}</span>
            ))}
          </div>
          {expensesWithIva.map((e,i)=>(
            <div key={e.id||i} style={{display:"grid",gridTemplateColumns:"1fr 80px 80px 80px 60px",gap:4,padding:"6px 14px",borderBottom:i<expensesWithIva.length-1?"0.5px solid #f0f0f0":"none",background:i%2===0?"#fff":"#fafafa"}}>
              <span style={{fontSize:14,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{e.description||"Sin descripción"}</span>
              <span style={{fontSize:14,textAlign:"right"}}>€{fmtCur(e.amount)}</span>
              <span style={{fontSize:14,textAlign:"right",color:"#666"}}>€{fmtCur(e._baseCalc)}</span>
              <span style={{fontSize:14,textAlign:"right",fontWeight:600,color:"#E24B4A"}}>€{fmtCur(e._ivaCalc)}</span>
              <span style={{fontSize:12,textAlign:"right",color:e._source==="factura"?"#3B6D11":"#854F0B"}}>
                {e._source==="factura"?"📄 real":"🔢 calc."}
              </span>
            </div>
          ))}
          <div style={{display:"grid",gridTemplateColumns:"1fr 80px 80px 80px 60px",gap:4,padding:"7px 14px",background:"#f5f5f5",borderTop:"0.5px solid #ccc"}}>
            <span style={{fontSize:14,fontWeight:600}}>TOTAL</span>
            <span style={{fontSize:14,fontWeight:600,textAlign:"right"}}>€{fmtCur(qExpTotal)}</span>
            <span style={{fontSize:14,fontWeight:600,textAlign:"right",color:"#666"}}>€{fmtCur(baseGastos)}</span>
            <span style={{fontSize:15,fontWeight:700,textAlign:"right",color:"#E24B4A"}}>€{fmtCur(ivaSoportado)}</span>
            <span/>
          </div>
        </div>
      )}

      {/* Operation */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 110px 110px 110px",gap:8,padding:"8px 14px",borderBottom:"0.5px solid #e5e5e5",background:"#f5f5f5"}}>
        <span style={{fontSize:14,color:"#666"}}>IVA repercutido − IVA soportado</span>
        <span/><span/>
        <span style={{fontSize:14,textAlign:"right",color:"#666"}}>€{fmtCur(ivaRepercutido)} − €{fmtCur(ivaSoportado)}</span>
      </div>

      {/* Result */}
      <div style={{padding:"14px",background:"#ffffff"}}>
        <div style={{background:bg,border:`0.5px solid ${border}`,borderRadius:8,padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
          <div>
            <p style={{margin:0,fontSize:15,color,fontWeight:600}}>{sign} a Hacienda (Mod. 303)</p>
            <p style={{margin:"3px 0 0",fontSize:13,color:"#666"}}>
              Total IVA gastos: €{fmtCur(ivaSoportado)} ({gastosConIva.length} de factura + {gastosSinIva.length} calculado al {ivaFallbackRate}%)
            </p>
          </div>
          <span style={{fontSize:26,fontWeight:700,color}}>{ivaLiquidar<0?"-":""}€{fmtCur(Math.abs(ivaLiquidar))}</span>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:10}}>
          {[
            {label:"IVA repercutido",value:ivaRepercutido,color:"#3B6D11",desc:`Cobrado a clientes (${ivaInRate}%)`},
            {label:"IVA soportado",value:ivaSoportado,color:"#E24B4A",desc:`€${fmtCur(ivaLeidoReal)} real + €${fmtCur(ivaEstimado)} calc.`},
            {label:"Resultado",value:Math.abs(ivaLiquidar),color,desc:sign},
          ].map(c=>(
            <div key={c.label} style={{background:"#f5f5f5",borderRadius:6,padding:"8px 10px"}}>
              <p style={{margin:0,fontSize:13,color:"#666"}}>{c.label}</p>
              <p style={{margin:"2px 0 1px",fontSize:17,fontWeight:600,color:c.color}}>€{fmtCur(c.value)}</p>
              <p style={{margin:0,fontSize:12,color:"#666"}}>{c.desc}</p>
            </div>
          ))}
        </div>
        <p style={{margin:"10px 0 0",fontSize:13,color:"#666"}}>⚠️ Estimación orientativa. Consulta con tu gestor/a para la presentación oficial del Modelo 303.</p>
      </div>
    </div>
  );
}

            {["form","preview"].map(m=>(
              <button key={m} onClick={()=>setMode(m)} style={{padding:"4px 10px",fontSize:14,border:"0.5px solid #ccc",borderRadius:6,background:mode===m?"#111":"none",color:mode===m?"#fff":"#666",cursor:"pointer"}}>
                {m==="form"?"✎ Editar":"👁 Vista previa"}
              </button>
            ))}
            <button onClick={onClose} style={{fontSize:20,border:"none",background:"none",cursor:"pointer",color:"#666",marginLeft:4}}>×</button>
          </div>
        </div>

        {mode==="form" ? (
          <div style={{padding:"16px 20px"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div style={{marginBottom:12}}>
                <span style={{fontSize:14,color:"#666",display:"block",marginBottom:4}}>Nº Factura</span>
                <div style={{...inp,background:"#f5f5f5",color:"#333",fontWeight:700,fontSize:17,display:"flex",alignItems:"center",gap:6,cursor:"default"}}>
                  <span style={{fontSize:15}}>🔢</span>
                  {form.num}
                  <span style={{fontSize:12,color:"#888",marginLeft:"auto",fontWeight:400}}>automático</span>
                </div>
              </div>
              {field("Fecha", <input type="date" style={inp} value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))} />)}
            </div>
            {field("Cliente", <input style={inp} value={form.client||""} onChange={e=>setForm(f=>({...f,client:e.target.value}))} placeholder="CLIENTES VARIOS" />)}
            {field("Concepto / Descripción", <input style={inp} value={form.concept||""} onChange={e=>setForm(f=>({...f,concept:e.target.value}))} placeholder="Ej: Sesión Embarazo" />)}
            {field("Importe TOTAL con IVA (€)", <input type="number" min="0" step="0.01" style={inp} value={form.total||""} onChange={e=>setForm(f=>({...f,total:e.target.value}))} placeholder="200.00" />)}

            {total > 0 && (
              <div style={{background:"#EAF3DE",border:"0.5px solid #97C459",borderRadius:8,padding:"10px 14px",marginBottom:12,display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                {[{l:"Base imponible",v:base},{l:"IVA 21%",v:iva},{l:"Total factura",v:total}].map(c=>(
                  <div key={c.l}>
                    <p style={{margin:0,fontSize:12,color:"#3B6D11"}}>{c.l}</p>
                    <p style={{margin:0,fontSize:18,fontWeight:700,color:"#3B6D11"}}>€{fmtCur(c.v)}</p>
                  </div>
                ))}
              </div>
            )}
            {field("Notas / IBAN (opcional)", <textarea rows={2} style={{...inp,resize:"vertical"}} value={form.notes||""} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Nº de cuenta para transferencia, etc." />)}

            <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:8}}>
              <button onClick={onClose} style={{padding:"8px 16px",fontSize:16,border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666"}}>Cancelar</button>
              <button onClick={handleSave} disabled={!total} style={{padding:"8px 18px",fontSize:16,border:"none",borderRadius:6,background:!total?"#999":"#111",color:"#fff",cursor:!total?"not-allowed":"pointer",fontWeight:500}}>
                Guardar y ver factura →
              </button>
            </div>
          </div>
        ) : (
          <div style={{padding:"16px 20px"}}>
            {/* Scaled preview — 680px invoice at 0.88 scale = ~598px display */}
            <div style={{width:598, height:0, overflow:"visible", marginBottom:14}}>
              <div style={{width:680, transform:"scale(0.88)", transformOrigin:"top left"}}
                dangerouslySetInnerHTML={{__html: invoiceHTML(false)}}/>
            </div>
            {/* Spacer to push buttons below the scaled content */}
            <div style={{height: Math.round(680 * 0.88 * 0.75)}}/>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:8}}>
              <button onClick={()=>setMode("form")} style={{padding:"8px 14px",fontSize:16,border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666"}}>✎ Editar</button>
              <button onClick={printInvoice} style={{padding:"8px 20px",fontSize:16,border:"none",borderRadius:6,background:"#111",color:"#fff",cursor:"pointer",fontWeight:500}}>🖨️ Imprimir / Guardar PDF</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
