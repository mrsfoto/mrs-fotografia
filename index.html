async function dbLoad(table) {
  try {
    const { data, error } = await supabase.from(table).select("*");
    if(error) { console.error("dbLoad error:", table, error); return []; }
    return (data || []).map(r => r.data).filter(Boolean);
  } catch(e) { console.error("dbLoad exception:", e); return []; }
}

async function dbSave(table, arr) {
  try {
    if(!arr || !arr.length) return;
    const rows = arr.map(item => ({ id: String(item.id), data: item }));
    const { error } = await supabase.from(table).upsert(rows, { onConflict: "id" });
    if(error) console.error("dbSave error:", table, error);
  } catch(e) { console.error("dbSave exception:", e); }
}

async function dbDelete(table, id) {
  try {
    await supabase.from(table).delete().eq("id", String(id));
  } catch {}
}

function useSupabase(table, init) {
  const [val, setValRaw] = useState(init);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    dbLoad(table).then(rows => {
      if(rows && rows.length > 0) setValRaw(rows);
      setLoaded(true);
    });
  }, [table]);

  const setVal = (updater) => {
    setValRaw(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      dbSave(table, next);
      return next;
    });
  };

  return [val, setVal, loaded];
}

    <div style={{marginBottom:12}}>
      <span style={{fontSize:14,color:"#666",display:"block",marginBottom:4}}>{lbl}</span>
      {el}
    </div>
  );

  if(!allLoaded) return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"80vh",gap:16}}>
      <div style={{fontSize:40}}>📷</div>
      <p style={{fontSize:20,fontWeight:500,color:"#111"}}>MRS Fotografía</p>
      <p style={{fontSize:15,color:"#666"}}>Conectando con la nube…</p>
      <div style={{width:36,height:36,border:"3px solid #e5e5e5",borderTop:"3px solid #111",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  return (
    <div style={{padding:"1rem 0",maxWidth:780,margin:"0 auto"}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1rem",flexWrap:"wrap",gap:8}}>
        <div>
          <h2 style={{margin:0,fontSize:22,fontWeight:500}}>Estudio Fotográfico</h2>
          <p style={{margin:0,fontSize:15,color:"#666"}}>Agenda y pagos</p>
        </div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
          {[["calendar","📅 Calendario"],["list","☰ Lista"],["upcoming","⏰ Próximas"],["cobros","💵 Cobros"],["billing","💰 Facturación"],["invoices","🧾 Facturas"]].map(([k,lbl])=>(
            <button key={k} onClick={()=>setView(k)} style={{padding:"6px 12px",fontSize:15,border:"0.5px solid #ccc",borderRadius:6,background:view===k?"#111":"none",color:view===k?"#ffffff":"#666",cursor:"pointer",fontWeight:view===k?500:400}}>
              {lbl}
            </button>
          ))}
          <button title="Exportar datos" onClick={()=>{
            const data = JSON.stringify({sessions,blocks,expenses,invoices},null,2);
            const blob = new Blob([data],{type:"application/json"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `mrs_datos_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
          }} style={{padding:"6px 10px",fontSize:15,border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666"}}>⬇️</button>
          <label title="Importar datos" style={{padding:"6px 10px",fontSize:15,border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666",display:"flex",alignItems:"center"}}>
            ⬆️
            <input type="file" accept=".json" style={{display:"none"}} onChange={e=>{
              const file = e.target.files[0]; if(!file) return;
              const reader = new FileReader();
              reader.onload = ev => {
                try {
                  const d = JSON.parse(ev.target.result);
                  if(d.sessions) setSessions(d.sessions);
                  if(d.blocks)   setBlocks(d.blocks);
                  if(d.expenses) setExpenses(d.expenses);
                  if(d.invoices) setInvoices(d.invoices);
                } catch {}
              };
              reader.readAsText(file);
            }}/>
          </label>
        </div>
      </div>

      {/* Summary cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:10,marginBottom:8}}>
        {[
          {label:"Sesiones",value:sessions.length,color:"#111",sub:`${thisMonthSessions.length} sesiones + ${thisMonthInvoices.length} facturas este mes`},
          {label:"Cobrado",value:"€"+fmtCur(totalCobradoTotal),color:"#3B6D11",sub:`${sessions.filter(s=>s.status==="Pagado").length} sesiones pagadas`},
          {label:"Pendiente sesiones",value:"€"+fmtCur(totalPending),color:"#c00",sub:`${sessions.filter(s=>s.status!=="Pagado").length} sin cerrar`},
        ].map(c=>(
          <div key={c.label} style={{background:"#f5f5f5",borderRadius:6,padding:"10px 14px"}}>
            <p style={{margin:0,fontSize:14,color:"#666"}}>{c.label}</p>
            <p style={{margin:"2px 0 2px",fontSize:20,fontWeight:500,color:c.color}}>{c.value}</p>
            <p style={{margin:0,fontSize:13,color:"#666"}}>{c.sub}</p>
          </div>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:"1.25rem"}}>
        {[
          {label:"💵 Efectivo",value:"€"+fmtCur(totalEfectivo),color:"#111",sub:"Cobrado en efectivo (sesiones)"},
          {label:"📱 Bizum / Transferencia",value:"€"+fmtCur(totalBizum),color:"#3C3489",sub:"Total cobrado digital (sesiones)"},
        ].map(c=>(
          <div key={c.label} style={{background:"#f5f5f5",borderRadius:6,padding:"10px 14px"}}>
            <p style={{margin:0,fontSize:14,color:"#666"}}>{c.label}</p>
            <p style={{margin:"2px 0 2px",fontSize:20,fontWeight:500,color:c.color}}>{c.value}</p>
            <p style={{margin:0,fontSize:13,color:"#666"}}>{c.sub}</p>
          </div>
        ))}
      </div>

      {/* ── CALENDARIO ── */}
      {view==="calendar" && <>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,gap:8}}>
          <button onClick={prevMonth} style={{padding:"5px 12px",fontSize:18,border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666"}}>‹</button>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontWeight:500,fontSize:18}}>{MONTHS_ES[calMonth]} {calYear}</span>
            <button onClick={goToday} style={{padding:"3px 9px",fontSize:14,border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666"}}>Hoy</button>
          </div>
          <button onClick={nextMonth} style={{padding:"5px 12px",fontSize:18,border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666"}}>›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:2,marginBottom:2}}>
          {DAYS_ES.map(d=><div key={d} style={{textAlign:"center",fontSize:13,color:"#666",padding:"4px 0",fontWeight:500}}>{d}</div>)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:2}}>
          {cells.map((d,i)=>{
            if(!d) return <div key={i}/>;
            const ds = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
            const items = itemsOnDate(ds);
            const dayInvoices = invoices.filter(inv=>inv.date===ds);
            const allDayItems = [...items, ...dayInvoices.map(inv=>({...inv,_type:"invoice"}))];
            const isTd = ds===todayStr;
            const isSel = selectedDay===ds;
            const isPast = ds < todayStr;
            return (
              <div key={i} onClick={()=>setSelectedDay(isSel?null:ds)}
                style={{minHeight:58,border:`0.5px solid ${isSel?"#888":"#e5e5e5"}`,borderRadius:6,padding:"4px 5px",cursor:"pointer",background:isSel?"#f5f5f5":isPast&&!isTd?"rgba(0,0,0,0.01)":"#ffffff",opacity:isPast&&!isTd?0.7:1}}>
                <div style={{fontSize:14,fontWeight:isTd?600:400,color:isTd?"#1a5fa8":"#111",marginBottom:2,
                  ...(isTd?{background:"#1a5fa8",color:"#fff",borderRadius:"50%",width:18,height:18,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}:{})}}>
                  {d}
                </div>
                {allDayItems.slice(0,3).map(item=>{
                  let bg, color;
                  if(item._type==="invoice") { bg=INVOICE_COLOR.bg; color=INVOICE_COLOR.text; }
                  else if(item._type==="block") { bg=BLOCK_COLOR.bg; color=BLOCK_COLOR.text; }
                  else {
                    const hasBizum = Number(item.depositBizum||0)+Number(item.sessionBizum||0) > 0;
                    const hasEfectivo = Number(item.depositEfectivo||0)+Number(item.sessionEfectivo||0) > 0;
                    if(hasBizum) { bg="#DBEAFE"; color="#1E40AF"; }           // azul — bizum o combinado
                    else if(hasEfectivo) { bg="#D1FAE5"; color="#065F46"; }   // verde — solo efectivo
                    else { bg=STATUS_COLORS[item.status]?.bg; color=STATUS_COLORS[item.status]?.text; } // sin pago → estado
                  }
                  return (
                    <div key={item.id} style={{fontSize:11,borderRadius:3,padding:"1px 4px",marginBottom:1,background:bg,color,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>
                      {item._type==="invoice"?"🧾 "+item.num:item._type==="block"?item.label:item.time+" "+item.client}
                    </div>
                  );
                })}
                {allDayItems.length>3 && <div style={{fontSize:11,color:"#666"}}>+{allDayItems.length-3}</div>}
              </div>
            );
          })}
        </div>

        {selectedDay && (
          <div style={{marginTop:14,border:"0.5px solid #e5e5e5",borderRadius:10,overflow:"hidden"}}>
            <div style={{padding:"10px 16px",borderBottom:"0.5px solid #e5e5e5",display:"flex",alignItems:"center",justifyContent:"space-between",background:"#f5f5f5"}}>
              <span style={{fontWeight:500,fontSize:17}}>
                {new Date(selectedDay+"T00:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}
              </span>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <button onClick={()=>{setFormType("session");setForm(emptySession(selectedDay,""));setModal("form");}} style={{padding:"4px 10px",fontSize:14,border:"0.5px solid #222",borderRadius:6,background:"#111",cursor:"pointer",color:"#fff"}}>+ Sesión</button>
                <button onClick={()=>setSelectedDay(null)} style={{fontSize:18,border:"none",background:"none",cursor:"pointer",color:"#666"}}>×</button>
              </div>
            </div>
            <div style={{padding:"12px 16px"}}>
              {/* Facturas emitidas ese día */}
              {invoices.filter(inv=>inv.date===selectedDay).length>0 && (
                <div style={{marginBottom:14}}>
                  <p style={{fontSize:13,fontWeight:500,color:"#666",margin:"0 0 6px",textTransform:"uppercase",letterSpacing:.8}}>🧾 Facturas emitidas</p>
                  <div style={{display:"flex",flexDirection:"column",gap:5}}>
                    {invoices.filter(inv=>inv.date===selectedDay).map(inv=>(
                      <div key={inv.id} onClick={()=>setInvoiceModal({...inv})}
                        style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:INVOICE_COLOR.bg,border:`0.5px solid ${INVOICE_COLOR.border}`,borderRadius:6,padding:"7px 12px",cursor:"pointer"}}>
                        <div>
                          <span style={{fontSize:15,fontWeight:600,color:INVOICE_COLOR.text}}>Factura {inv.num}</span>
                          <span style={{fontSize:14,color:"#555",marginLeft:8}}>{inv.concept}</span>
                        </div>
                        <span style={{fontSize:15,fontWeight:700,color:INVOICE_COLOR.text}}>€{fmtCur(inv.total)}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {[["Mañana · 10:00 – 13:00", MORNING],["Tarde · 16:00 – 18:00", AFTERNOON]].map(([label,slots])=>(
                <div key={label} style={{marginBottom:14}}>
                  <p style={{fontSize:13,fontWeight:500,color:"#666",margin:"0 0 6px",textTransform:"uppercase",letterSpacing:.8}}>{label}</p>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:6}}>
                    {slots.map(slot=>{
                      const its = itemsOnSlot(selectedDay,slot);
                      return <SlotCell key={slot} slot={slot} items={its}
                        onAdd={()=>openSlot(selectedDay,slot)}
                        onBlock={()=>openBlock(selectedDay,slot)}
                        onEdit={openEdit}
                        onDelete={id=>setDeleteConfirm({id,type:allItems.find(x=>x.id===id)?._type==="block"?"block":"session"})}
                      />;
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </>}

      {/* ── PRÓXIMAS SESIONES ── */}
      {view==="upcoming" && <>
        <h3 style={{fontSize:17,fontWeight:500,margin:"0 0 12px"}}>Próximas sesiones</h3>
        {upcomingSessions.length === 0 && <p style={{color:"#666",fontSize:16,textAlign:"center",padding:"2rem 0"}}>No hay sesiones próximas.</p>}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {upcomingSessions.map(s => {
            const d = new Date(s.date+"T00:00:00");
            const diffDays = Math.ceil((d - today) / 86400000);
            const label = diffDays === 0 ? "Hoy" : diffDays === 1 ? "Mañana" : `En ${diffDays} días`;
            const sc = STATUS_COLORS[s.status]||STATUS_COLORS.Pendiente;
            return (
              <div key={s.id} style={{background:"#ffffff",border:"0.5px solid #e5e5e5",borderRadius:10,padding:"12px 16px",display:"flex",gap:12,alignItems:"flex-start"}}>
                <div style={{minWidth:48,textAlign:"center",background:"#f5f5f5",borderRadius:6,padding:"6px 0",flexShrink:0}}>
                  <div style={{fontSize:13,color:"#666",fontWeight:500}}>{MONTHS_ES[d.getMonth()].slice(0,3).toUpperCase()}</div>
                  <div style={{fontSize:24,fontWeight:600,lineHeight:1}}>{d.getDate()}</div>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3,flexWrap:"wrap"}}>
                    <span style={{fontWeight:500,fontSize:17}}>{s.client||"Sin nombre"}</span>
                    <span style={{fontSize:12,padding:"2px 7px",borderRadius:20,background:sc.bg,color:sc.text,border:`0.5px solid ${sc.border}`}}>{s.status}</span>
                    <span style={{fontSize:12,padding:"2px 7px",borderRadius:20,background:"#f5f5f5",color:"#666"}}>{s.type}</span>
                  </div>
                  <p style={{margin:0,fontSize:15,color:"#666"}}>
                    {s.time && <span>{s.time} · </span>}
                    <span style={{fontWeight:500,color:diffDays===0?"#c00":diffDays===1?"#854F0B":"#666"}}>{label}</span>
                  </p>
                  {s.phone && <p style={{margin:"2px 0 0",fontSize:14,color:"#666"}}>📞 {s.phone}</p>}
                  {s.notes && <p style={{margin:"2px 0 0",fontSize:14,color:"#666",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>📝 {s.notes}</p>}
                </div>
                <div style={{display:"flex",gap:5,flexShrink:0}}>
                  <button onClick={()=>openEdit({...s,_type:"session"})} style={{fontSize:14,padding:"4px 9px",border:"0.5px solid #ccc",borderRadius:6,background:"none",cursor:"pointer",color:"#666"}}>Editar</button>
                </div>
              </div>
            );
          })}
        </div>

        {sessions.filter(s=>s.date<todayStr).length>0 && <>
          <h3 style={{fontSize:17,fontWeight:500,margin:"20px 0 12px",display:"flex",alignItems:"center",gap:8}}>
            Sesiones pasadas sin cerrar
            <span style={{fontSize:14,fontWeight:400,color:"#c00"}}>
              {sessions.filter(s=>s.date<todayStr && s.status!=="Pagado").length} pendientes de cobro
            </span>
          </h3>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {sessions.filter(s=>s.date<todayStr && s.status!=="Pagado").sort((a,b)=>b.date>a.date?1:-1).slice(0,5).map(s=>(
              <ListItem key={s.id} item={{...s,_type:"session"}} onEdit={openEdit} onDelete={id=>setDeleteConfirm({id,type:"session"})} />
            ))}
          </div>
        </>}
      </>}

      {/* ── COBROS ── */}
      {view==="cobros" && <>
        {/* Totales globales */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:16}}>
          {[
            {icon:"💵",label:"Total Efectivo",value:totalEfectivo,color:"#3B6D11",bg:"#EAF3DE",border:"#97C459"},
            {icon:"📱",label:"Total Bizum / Transf.",value:totalBizum,color:"#3C3489",bg:"#EEEDFE",border:"#AFA9EC"},
            {icon:"💰",label:"Total cobrado",value:totalEfectivo+totalBizum,color:"#111",bg:"#f5f5f5",border:"#e5e5e5"},
          ].map(c=>(
            <div key={c.label} style={{background:c.bg,border:`0.5px solid ${c.border}`,borderRadius:6,padding:"12px 14px"}}>
              <p style={{margin:0,fontSize:14,color:c.color}}>{c.icon} {c.label}</p>
              <p style={{margin:"4px 0 0",fontSize:24,fontWeight:700,color:c.color}}>€{fmtCur(c.value)}</p>
            </div>
          ))}
        </div>

        {/* Lista detallada por sesión */}
        <div style={{border:"0.5px solid #e5e5e5",borderRadius:10,overflow:"hidden",marginBottom:14}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 90px 90px 90px 90px 80px",gap:8,padding:"8px 14px",background:"#f5f5f5",borderBottom:"0.5px solid #e5e5e5"}}>
            {["Cliente / Tipo","Fecha","💵 Efectivo","📱 Bizum","Total cobrado","Estado"].map(h=>(
              <span key={h} style={{fontSize:13,fontWeight:500,color:"#666",textAlign:h==="Cliente / Tipo"?"left":"right"}}>{h}</span>
            ))}
          </div>
          {sessions.length===0 && <p style={{textAlign:"center",color:"#666",fontSize:16,padding:"2rem 0",margin:0}}>Sin sesiones registradas.</p>}
          {[...sessions].sort((a,b)=>((b.date||"")+(b.time||""))>((a.date||"")+(a.time||""))?1:-1).map((s,i)=>{
            const ef  = Number(s.depositEfectivo||0)+Number(s.sessionEfectivo||0);
            const biz = Number(s.depositBizum||0)+Number(s.sessionBizum||0);
            const paid= ef+biz;
            const sc  = STATUS_COLORS[s.status]||STATUS_COLORS.Pendiente;
            const d   = s.date?new Date(s.date+"T00:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"}): "—";
            return (
              <div key={s.id} onClick={()=>openEdit({...s,_type:"session"})}
                style={{display:"grid",gridTemplateColumns:"1fr 90px 90px 90px 90px 80px",gap:8,padding:"9px 14px",borderBottom:i<sessions.length-1?"0.5px solid #e5e5e5":"none",background:i%2===0?"transparent":"#f5f5f5",cursor:"pointer",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:15,fontWeight:500}}>{s.client||"Sin nombre"}</div>
                  <div style={{fontSize:13,color:"#666"}}>{s.type}</div>
                </div>
                <span style={{fontSize:14,color:"#666",textAlign:"right"}}>{d}</span>
                <span style={{fontSize:15,fontWeight:ef>0?600:400,color:ef>0?"#3B6D11":"#666",textAlign:"right"}}>{ef>0?"€"+fmtCur(ef):"—"}</span>
                <span style={{fontSize:15,fontWeight:biz>0?600:400,color:biz>0?"#3C3489":"#666",textAlign:"right"}}>{biz>0?"€"+fmtCur(biz):"—"}</span>
                <span style={{fontSize:15,fontWeight:500,textAlign:"right"}}>{paid>0?"€"+fmtCur(paid):"—"}</span>
                <span style={{fontSize:13,padding:"2px 7px",borderRadius:20,background:sc.bg,color:sc.text,border:`0.5px solid ${sc.border}`,textAlign:"center"}}>{s.status}</span>
              </div>
            );
          })}
          {sessions.length>0 && (
            <div style={{display:"grid",gridTemplateColumns:"1fr 90px 90px 90px 90px 80px",gap:8,padding:"10px 14px",borderTop:"0.5px solid #888",background:"#f5f5f5",alignItems:"center"}}>
              <span style={{fontSize:15,fontWeight:600}}>Subtotal sesiones</span><span/>
              <span style={{fontSize:15,fontWeight:700,color:"#3B6D11",textAlign:"right"}}>€{fmtCur(totalEfectivo)}</span>
              <span style={{fontSize:15,fontWeight:700,color:"#3C3489",textAlign:"right"}}>€{fmtCur(totalBizumSessions)}</span>
              <span style={{fontSize:15,fontWeight:700,textAlign:"right"}}>€{fmtCur(totalCollected)}</span>
              <span/>
            </div>
          )}
        </div>

        {/* Facturas emitidas — todas por Bizum */}
        {invoices.length>0 && (
          <div style={{border:"0.5px solid #e5e5e5",borderRadius:10,overflow:"hidden",marginBottom:14}}>
            <div style={{padding:"8px 14px",background:INVOICE_COLOR.bg,borderBottom:"0.5px solid #e5e5e5",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:14,fontWeight:600,color:INVOICE_COLOR.text}}>🧾 Facturas emitidas · cobradas por Bizum/Transferencia</span>
              <span style={{fontSize:14,fontWeight:600,color:INVOICE_COLOR.text}}>€{fmtCur(totalInvoicesBizum)}</span>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 90px 90px 90px 90px 80px",gap:8,padding:"7px 14px",background:"#f5f5f5",borderBottom:"0.5px solid #e5e5e5"}}>
              {["Nº / Concepto","Fecha","💵 Efectivo","📱 Bizum","Total",""].map(h=>(
                <span key={h} style={{fontSize:13,fontWeight:500,color:"#666",textAlign:h==="Nº / Concepto"?"left":"right"}}>{h}</span>
              ))}
            </div>
            {[...invoices].sort((a,b)=>b.date>a.date?1:-1).map((inv,i)=>{
              const d = inv.date?new Date(inv.date+"T00:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"}):"—";
              return (
                <div key={inv.id} onClick={()=>setInvoiceModal({...inv})}
                  style={{display:"grid",gridTemplateColumns:"1fr 90px 90px 90px 90px 80px",gap:8,padding:"9px 14px",borderBottom:i<invoices.length-1?"0.5px solid #e5e5e5":"none",background:i%2===0?"transparent":"#f5f5f5",cursor:"pointer",alignItems:"center"}}>
                  <div>
                    <div style={{fontSize:15,fontWeight:500}}>{inv.num}</div>
                    <div style={{fontSize:13,color:"#666"}}>{inv.concept}</div>
                  </div>
                  <span style={{fontSize:14,color:"#666",textAlign:"right"}}>{d}</span>
                  <span style={{fontSize:15,color:"#666",textAlign:"right"}}>—</span>
                  <span style={{fontSize:15,fontWeight:600,color:"#3C3489",textAlign:"right"}}>€{fmtCur(inv.total)}</span>
                  <span style={{fontSize:15,fontWeight:500,textAlign:"right"}}>€{fmtCur(inv.total)}</span>
                  <span style={{fontSize:12,padding:"2px 7px",borderRadius:20,background:INVOICE_COLOR.bg,color:INVOICE_COLOR.text,border:`0.5px solid ${INVOICE_COLOR.border}`,textAlign:"center"}}>Pagada</span>
                </div>
              );
            })}
            <div style={{display:"grid",gridTemplateColumns:"1fr 90px 90px 90px 90px 80px",gap:8,padding:"10px 14px",borderTop:"0.5px solid #888",background:"#f5f5f5",alignItems:"center"}}>
              <span style={{fontSize:15,fontWeight:600}}>Subtotal facturas</span><span/>
              <span style={{fontSize:15,textAlign:"right",color:"#666"}}>—</span>
              <span style={{fontSize:15,fontWeight:700,color:"#3C3489",textAlign:"right"}}>€{fmtCur(totalInvoicesBizum)}</span>
              <span style={{fontSize:15,fontWeight:700,textAlign:"right"}}>€{fmtCur(totalInvoicesBizum)}</span>
              <span/>
            </div>

        </div>

          const wrongInThisQ = sessions.filter(s => {
            if(!s.date) return false;
            const d = new Date(s.date+"T00:00:00");
            return d.getFullYear()===qYear && qMonthSet.has(d.getMonth());
          }).filter(s => !qSessions.find(qs => qs.id === s.id)); // shouldn't happen but safety

          // Sessions IN this quarter view but whose date is actually in another quarter
          const wrongDates = qSessions.filter(s => {
            if(!s.date) return false;
            const d = new Date(s.date+"T00:00:00");
            return !qMonthSet.has(d.getMonth()) || d.getFullYear()!==qYear;
          });

          // Sessions in other quarters that have dates that belong here
          const misplacedElsewhere = sessions.filter(s => {
            if(!s.date) return false;
            const d = new Date(s.date+"T00:00:00");
            const isInThisQDate = d.getFullYear()===qYear && qMonthSet.has(d.getMonth());
            const isInThisQList = !!qSessions.find(qs=>qs.id===s.id);
            return isInThisQDate && !isInThisQList;

                </div>

                    <span style={{fontSize:15,fontWeight:600,color:"#854F0B"}}>

                          style={{fontSize:13,padding:"3px 8px",border:"0.5px solid #854F0B",borderRadius:5,background:"none",cursor:"pointer",color:"#854F0B"}}>

                  <p style={{margin:"6px 0 0",fontSize:13,color:"#854F0B"}}>Estas sesiones tienen fecha en este trimestre pero están registradas en otro. Revisa si la fecha es correcta.</p>

            {label:"Cobrado",value:"€"+fmtCur(qPaid),color:"#3B6D11",sub:"Ingresos de sesiones"},
            {label:"Por cobrar",value:"€"+fmtCur(qPending),color:qPending>0?"#c00":"#666",sub:"Pendiente sesiones"},

                  <div style={{fontSize:13,color:INVOICE_COLOR.text}}>{inv.concept}</div>

                <span style={{fontSize:15,color:"#666",alignSelf:"center"}}>{d}</span>

                <div key={e.id} style={{display:"grid",gridTemplateColumns:"1fr 130px 90px 32px",padding:"8px 14px",gap:8,borderBottom:i<qExpenses.length-1?"0.5px solid #e5e5e5":"none",background:i%2===0?"transparent":"#f5f5f5"}}>
                  <div>
                    <div style={{fontSize:15,fontWeight:500}}>{e.description||"Sin descripción"}</div>

                  <span style={{fontSize:15,color:"#666",alignSelf:"center"}}>{d}</span>

              <span style={{fontSize:15,fontWeight:600,color:"#854F0B"}}>€{fmtCur(qExpTotal)}</span><span/>
            </div>
          </div>

        {/* ── IVA LIQUIDACIÓN ── */}
        <IvaBlock qPaid={qPaid} qExpTotal={qExpTotal} qSessions={qSessions} qExpenses={qExpenses} fmtCur={fmtCur}
